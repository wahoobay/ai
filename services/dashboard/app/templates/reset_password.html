<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose a new password — Wahoo Bay</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="auth-page">
  <header class="auth-top">
    <h1><a href="/">Wahoo Bay · Live Fish ID</a></h1>
  </header>
  <main class="auth-card">
    <p class="auth-eyebrow">Account</p>
    <h1>Choose a new password</h1>
    <form id="reset-form">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" required>
      <label for="password2">Confirm new password</label>
      <input id="password2" name="password2" type="password"
             autocomplete="new-password" required>
      <p class="auth-hint">At least 12 characters.</p>
      <p class="auth-error" id="reset-error" hidden></p>
      <button type="submit">Change password</button>
    </form>
    <p class="auth-done" id="reset-done" hidden></p>
  </main>
  <script src="/static/auth.js?v={{ asset_version }}"></script>
</body>
</html>
