<!doctype html>
<html lang="en" data-palette="blue" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset your password — Wahoo Bay</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/theme.css?v={{ asset_version }}">
  <script src="/static/theme.js?v={{ asset_version }}"></script>
</head>
<body class="auth-page">
  <header class="auth-top">
    <h1><a href="/">Wahoo Bay · Live Fish ID</a></h1>
    <div id="theme-controls" class="theme-controls"></div>
  </header>
  <main class="auth-card">
    <p class="auth-eyebrow">Account</p>
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter the email address on your account.</p>
    <form id="forgot-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Send reset link</button>
    </form>
    <p class="auth-done" id="forgot-done" hidden></p>
    <p class="auth-links"><a href="/login">Back to sign in</a></p>
  </main>
  <script src="/static/auth.js?v={{ asset_version }}"></script>
</body>
</html>
