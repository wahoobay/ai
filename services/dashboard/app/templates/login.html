<!doctype html>
<html lang="en" data-palette="blue" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — Wahoo Bay</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/theme.css?v={{ asset_version }}">
  <script src="/static/theme.js?v={{ asset_version }}"></script>
</head>
<body class="auth-page">
  <header class="auth-top">
    <h1><a href="/">Wahoo Bay · Live Fish ID</a></h1>
    <div id="theme-controls" class="theme-controls"></div>
  </header>
  <main class="auth-card">
    <p class="auth-eyebrow">Reviewers</p>
    <h1>Sign in</h1>
    <p class="auth-sub">Sign in to review and label the fish the cameras detect.</p>
    <form id="login-form" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <p class="auth-error" id="login-error" hidden></p>
      <button type="submit">Sign in</button>
    </form>
    <p class="auth-links">
      <a href="/register">Create an account</a> ·
      <a href="/forgot-password">Forgot password?</a>
    </p>
  </main>
  <script src="/static/auth.js?v={{ asset_version }}"></script>
</body>
</html>
