name: CI

# Every push to main and every pull request lints, smoke-imports the dashboard
# and poller, runs the test suite against PostgreSQL, and builds the six images:
# dashboard (service + lambda), poller (service + lambda), worker (cuda + cpu).
# On main the images are pushed to the AI repositories in ECR (account
# 226594054743, us-east-1) with the role the infra repository defines
# (ai-wahoobay-images-gha, assumed over OIDC: no stored keys), tagged
# sha-<12>[-lambda|-cpu] and main[-lambda|-cpu]. The infra repository's deploy
# workflow promotes a sha to staging / prod by retagging. Pull requests (forks
# included) build everything and push nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 226594054743.dkr.ecr.us-east-1.amazonaws.com
  IMAGES_ROLE: arn:aws:iam::226594054743:role/ai-wahoobay-images-gha

permissions:
  contents: read
  id-token: write # the OIDC token the image-push role trusts (main only)

concurrency:
  # On PRs, cancel in-flight runs of the same PR so we only ever build
  # the latest commit. On main, never cancel — we want every merged
  # commit's images to land in the registry.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------
  # Lint: ruff check + format. Fast (~30 s), runs on every push.
  # -------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: ruff check
        run: ruff check .
      # ruff format --check is deliberately not enabled yet — the
      # codebase has 3 k+ lines of pending formatting churn that we'll
      # land in one focused commit, then re-enable.

  # -------------------------------------------------------------------
  # Smoke-import the dashboard + poller modules, then run the test suite
  # against a real PostgreSQL (the schema comes from the Alembic
  # migrations). Worker is excluded from the imports — it needs torch /
  # cuda, which a CPU runner does not have.
  # -------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
          POSTGRES_DB: ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai -d ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dashboard requirements
        run: pip install -r services/dashboard/requirements.txt
      - name: Install poller requirements
        run: pip install -r services/sensestream_poller/requirements.txt
      - name: Smoke-import dashboard.app
        env:
          PYTHONPATH: services/dashboard:services
          DATABASE_URL: postgresql://wahoobay:wahoobay@localhost:5432/wahoobay
        run: python -c "from app import main; print('dashboard ok')"
      - name: Smoke-import poller.app
        env:
          PYTHONPATH: services/sensestream_poller
        run: python -c "from app import main; print('poller ok')"
      - name: Run the test suite against a real database
        env:
          TEST_DATABASE_URL: postgresql://ai:ai@localhost:5432/ai_test
        run: |
          pip install pytest
          pytest -q

  # -------------------------------------------------------------------
  # Build the six images; on main, push them to ECR. One matrix entry per
  # image. No weights travel in the worker images: the entrypoint fetches
  # them from MODELS_URL at start.
  # -------------------------------------------------------------------
  build-image:
    needs: [lint, smoke-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dashboard,        file: services/dashboard/Dockerfile,          target: service, repo: ai-wahoobay-dashboard, suffix: "" }
          - { name: dashboard-lambda, file: services/dashboard/Dockerfile,          target: lambda,  repo: ai-wahoobay-dashboard, suffix: "-lambda" }
          - { name: poller,           file: services/sensestream_poller/Dockerfile, target: service, repo: ai-wahoobay-poller,    suffix: "" }
          - { name: poller-lambda,    file: services/sensestream_poller/Dockerfile, target: lambda,  repo: ai-wahoobay-poller,    suffix: "-lambda" }
          - { name: worker,           file: services/worker/Dockerfile,             target: cuda,    repo: ai-wahoobay-worker,    suffix: "",        big: true }
          - { name: worker-cpu,       file: services/worker/Dockerfile,             target: cpu,     repo: ai-wahoobay-worker,    suffix: "-cpu" }
    env:
      # Only main pushes; the role's trust policy says the same thing.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk (the CUDA image is large)
        if: matrix.big == true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Assume the image-push role (main only)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IMAGES_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tags
        id: tags
        run: |
          SHA12=$(echo "${{ github.sha }}" | cut -c1-12)
          IMAGE="${ECR_REGISTRY}/${{ matrix.repo }}"
          TAGS="${IMAGE}:sha-${SHA12}${{ matrix.suffix }}"
          if [ "$PUSH" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:main${{ matrix.suffix }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # One cache scope per image so the CUDA layers don't evict the slim ones.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # A plain manifest (no attestation index): what Lambda and App Runner pull.
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
