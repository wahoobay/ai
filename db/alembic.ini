# Alembic owns the schema. The database comes from DATABASE_URL (or the DB_*
# parts) through migrations/env.py; nothing is configured here.
#   alembic -c db/alembic.ini upgrade head      bring a database to the current revision
#   alembic -c db/alembic.ini stamp 0001        a database built by the old db/init.sql joins in
#   alembic -c db/alembic.ini revision -m "..."  start a new revision in migrations/versions/
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
