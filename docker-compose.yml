# Local stack, by profile:
#   web  (make up)      postgres + migrate + dashboard + poller: a laptop, no GPU, no AWS
#   gpu  (make up-gpu)  + the worker on the host's NVIDIA GPU (Docker + NVIDIA Container Toolkit)
#   cpu  (make up-cpu)  + the worker's CPU build over data/test_videos (slow; fine for development)
#
# .env at the repo root is optional; .env.example documents every variable.
# Postgres credentials come from POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# (defaults wahoobay) and feed every DATABASE_URL here. Both worker flavours
# answer as `worker`, which is what the dashboard dials; the schema is applied
# by the `migrate` service (`make migrate`, run by `make up`), not at boot.
# Everything binds to 127.0.0.1 only; reach it from a laptop over an SSH tunnel.

x-env-file: &env_file
  - path: .env
    required: false

x-database-url: &database_url postgresql://${POSTGRES_USER:-wahoobay}:${POSTGRES_PASSWORD:-wahoobay}@postgres:5432/${POSTGRES_DB:-wahoobay}

# The local demo's site: the code has no default site, so compose names one here;
# a .env (see .env.example's site block) overrides every value.
x-site: &site
  LOCATION_ID: ${LOCATION_ID:-local}
  SENSESTREAM_DEPLOYMENT_URI: ${SENSESTREAM_DEPLOYMENT_URI:-demo}
  TZ: ${TZ:-UTC}

x-worker: &worker
  build:
    context: .
    dockerfile: services/worker/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
  env_file: *env_file
  environment: &worker_env
    <<: *site
    DATABASE_URL: *database_url
    # Container-internal paths; the .env values keep working for the bare-metal run_*.sh.
    DETECTOR_PATH: /data/models/detector_v26/model.pt
    CLASSIFIER_PATH: /data/models/classifier_v0_10_2/model.pt
    CLASSIFIER_INFERENCE_MODULE_DIR: /data/models/classifier_v0_10_2
    EVENTS_LOG_DIR: /data/logs/events
    FRAMES_URL: file:///data/frames
    MODELS_URL: file:///data/models
    FALLBACK_VIDEO_SOURCE: file:///data/test_videos
  volumes:
    # Host weights over /data/models (a bind-mounted data/models wins over fetch_models.py).
    - ./data/models:/data/models:ro
    - ./data/test_videos:/data/test_videos:ro
    - ./frames:/data/frames
    - ./logs:/data/logs
  ports:
    - "127.0.0.1:8081:8081"
  networks:
    default:
      aliases: [worker]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["web"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wahoobay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wahoobay}
      POSTGRES_DB: ${POSTGRES_DB:-wahoobay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wahoobay} -d ${POSTGRES_DB:-wahoobay}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    # One shot: brings the database to the current schema (Alembic head) and exits.
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    profiles: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *env_file
    environment:
      <<: *site
      DATABASE_URL: *database_url
    command: ["python", "-m", "app.migrate"]
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    profiles: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *env_file
    environment:
      <<: *site
      DATABASE_URL: *database_url
      FEATURE_REVIEW_TOOL: ${FEATURE_REVIEW_TOOL:-true}
      # No worker in the web profile: the live-video routes answer 503 until one joins.
      WORKER_URL: http://worker:8081
      FRAMES_URL: file:///data/frames
      # The image listens on 8080 (what App Runner expects); the host keeps 18080.
      DASHBOARD_PORT: "8080"
    volumes:
      - ./frames:/data/frames:ro
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

  sensestream-poller:
    build:
      context: .
      dockerfile: services/sensestream_poller/Dockerfile
    profiles: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *env_file
    environment:
      <<: *site
      DATABASE_URL: *database_url
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  worker:
    <<: *worker
    profiles: ["gpu"]
    # GPU passthrough. .env's CUDA_VISIBLE_DEVICES picks the physical GPU; inside
    # the container it is always cuda:0.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-cpu:
    <<: *worker
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: cpu
    environment:
      <<: *worker_env
      DEVICE: cpu
      VIDEO_SOURCE: file:///data/test_videos
      CLASSIFIER_AUTOCAST: "off"
      CLASSIFIER_V2_COMPILE: "false"

volumes:
  pgdata:
